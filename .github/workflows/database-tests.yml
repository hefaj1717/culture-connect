name: Database tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  push:
    branches:
      - master
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Run database contracts and RLS tests
        run: supabase test db --local
