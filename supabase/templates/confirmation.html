<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your CultureQuest verification code</title>
  </head>
  <body style="margin:0;background:#f7f4fb;font-family:Arial,Helvetica,sans-serif;color:#241c2e;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f4fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:24px;overflow:hidden;border:1px solid #eadff8;">
            <tr>
              <td style="background:#241c2e;padding:28px 28px 24px;">
                <div style="font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1;color:#ffffff;font-weight:700;">
                  CultureQuest
                </div>
                <div style="margin-top:10px;color:#d9cdf4;font-size:14px;line-height:22px;">
                  Confirm your email to start exploring your city.
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 28px;">
                <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#756f7b;font-weight:700;">
                  Verification code
                </div>
                <div style="margin-top:14px;font-size:42px;line-height:1;letter-spacing:8px;font-weight:800;color:#7c3aed;">
                  {{ .Token }}
                </div>
                <p style="margin:24px 0 0;font-size:15px;line-height:24px;color:#514a5c;">
                  Enter this code in the CultureQuest app to finish creating your account.
                </p>
                <p style="margin:18px 0 0;font-size:13px;line-height:20px;color:#756f7b;">
                  If the code does not work, you can use this fallback link:
                  <br />
                  <a href="{{ .ConfirmationURL }}" style="color:#7c3aed;font-weight:700;">Confirm email</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
