appId: host.exp.exponent
name: Student login RSVP check-in XP QC and reward journey
tags:
  - local
  - critical
---
# Flow 01 deliberately leaves Expo Go on the login screen. Keeping the same
# running React Native instance avoids a second deep-link race in Expo Go.
- extendedWaitUntil:
    visible:
      id: auth.screen
    timeout: 60000
- tapOn:
    id: auth.email
- inputText: student.e2e@culturequest.local
- tapOn:
    id: auth.password
- inputText: CultureQuestE2E!2026
- hideKeyboard
- tapOn:
    id: auth.submit
# Expo Go asks separately whether this experience may use coarse and fine
# location after the Android-level permission has already been granted.
- tapOn: ALLOW
- tapOn: ALLOW
- extendedWaitUntil:
    visible:
      id: app.authenticated
    timeout: 30000
- tapOn:
    id: tab.discover
- extendedWaitUntil:
    visible: E2E Live Culture Night
    timeout: 30000
- tapOn: E2E Live Culture Night
- assertVisible:
    id: event.detail
- tapOn:
    id: event.rsvp.interested
- tapOn:
    id: event.rsvp.going
- scrollUntilVisible:
    element:
      id: event.check-in.e2e
    direction: DOWN
- tapOn:
    id: event.check-in.e2e
- extendedWaitUntil:
    visible: Attendance confirmed
    timeout: 15000
- scrollUntilVisible:
    element:
      id: event.close
    direction: UP
- tapOn:
    id: event.close
- tapOn:
    id: tab.profile
- scrollUntilVisible:
    element: E2E Coffee Reward
    direction: DOWN
- tapOn: E2E Coffee Reward
- assertVisible:
    id: reward.detail
- scrollUntilVisible:
    element:
      id: reward.redeem
    direction: DOWN
- tapOn:
    id: reward.redeem
- extendedWaitUntil:
    visible: Coupon active
    timeout: 15000
- tapOn:
    id: reward.close
- extendedWaitUntil:
    visible:
      id: app.authenticated
    timeout: 15000
